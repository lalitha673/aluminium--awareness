<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Awareness Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>


<section class="hero text-center">

<div class="container">

<h1 class="main-title">
AWARENESS DASHBOARD
</h1>

<h3 class="hero-subtitle">
Aluminium Usage Survey Results
</h3>

<a href="index.html" class="btn btn-success">
← Back to Home
</a>

</div>

</section>



<div class="container my-5">


<div class="card shadow p-4">


<h2 class="text-center mb-4">
Community Survey Analysis
</h2>


<canvas id="riskChart"></canvas>


</div>


</div>

<script>

fetch("https://script.google.com/macros/s/AKfycbw4oOiYT85TcOzLZt-X_OqBuUAkpZC1mlBgkT6HIr0079a9ms4L16zws8BULziQIUDO/exec")
.then(response => response.json())
.then(data => {


new Chart(document.getElementById("riskChart"), {

type: "pie",

data: {

labels: [
"Low Risk",
"Moderate Risk",
"High Risk"
],

datasets: [{

data: [
data.low,
data.moderate,
data.high
]

}]

},

options: {

responsive:true,

plugins:{
legend:{
position:"bottom"
}

}

}

});


})
.catch(error => console.log(error));

</script>





<footer class="text-center">

<p>
© 2026 Reduce Aluminium Usage Awareness Project
</p>

</footer>


</body>

</html>
